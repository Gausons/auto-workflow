<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent 任务工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen"><noscript>请启用 JavaScript 后登录工作台。</noscript></section>
    <div class="app-shell" id="workspaceShell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
            <rect x="4" y="5" width="28" height="26" rx="6"></rect>
            <path d="M11 14h18M11 21h10M24 20l4 4-4 4"></path>
          </svg>
          <div>
            <strong>BugFlow</strong>
            <span>多设备 Agent 工作台</span>
          </div>
        </div>
        <nav class="nav-list" aria-label="主导航">
          <a class="nav-create-task" href="#new-task" data-nav="new-task"><span class="nav-icon" aria-hidden="true">＋</span><span>新建任务</span></a>
          <a href="#tasks" data-nav="tasks"><span class="nav-icon" aria-hidden="true">▣</span><span>任务中心</span></a>
          <a href="#workbench" data-nav="workbench"><span class="nav-icon" aria-hidden="true">◇</span><span>缺陷工作台</span></a>
          <a href="#history" data-nav="history"><span class="nav-icon" aria-hidden="true">◷</span><span>Agent 历史会话</span></a>
        </nav>
        <a class="settings-link" href="#settings/assignment" data-nav="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>设置</span></a>
        <div class="sidebar-note">
          <span class="status-dot" id="sidebarCredentialDot"></span>
          <span id="sidebarCredentialText">读取配置中</span>
        </div>
        <div class="tenant-panel">
          <span>当前团队</span>
          <strong id="tenantName"></strong>
          <span id="currentUser"></span>
          <button class="button secondary" type="button" id="logoutTenant">退出 / 切换团队</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">个人缺陷自动处理原型</p>
            <h1>集中管理缺陷，并直接生成 Agent 任务</h1>
          </div>
          <div class="top-actions" id="workbenchActions"></div>
        </header>

        <section class="page task-center" data-page="tasks" id="taskCenter" hidden aria-label="任务中心"></section>
        <section class="page history-page" data-page="history" hidden>
          <div class="history-heading"><h1>会话</h1><span>Agent 历史记录</span></div>
          <div class="history-layout">
            <aside class="history-browser" aria-label="历史会话列表">
              <form id="historyFilters" class="history-filters">
                <label class="history-search">搜索会话<input id="historyQuery" placeholder="搜索会话…" maxlength="200" /></label>
                <div class="history-selects">
                  <label>Agent<select id="historyAgent"><option value="">全部 Agent</option></select></label>
                  <label>工作区<select id="historyWorkspace"><option value="">全部工作区</option></select></label>
                </div>
                <button class="button secondary" type="submit">刷新会话</button>
              </form>
              <p id="historyStatus" role="status" aria-live="polite"></p>
              <div id="historyList" class="history-list"></div>
              <div class="history-pagination">
                <button id="historyPrev" class="button secondary" type="button" disabled aria-label="上一页">←</button>
                <span id="historyPage"></span>
                <button id="historyNext" class="button secondary" type="button" disabled aria-label="下一页">→</button>
              </div>
              <details class="history-source-details"><summary>数据来源</summary><p id="historySources" class="history-meta"></p></details>
            </aside>
            <div id="historyDetail" class="history-detail" aria-live="polite"><div class="history-empty"><span>◎</span><h2>从一个会话开始</h2><p>选择历史会话，查看对话与工作过程</p></div></div>
          </div>
        </section>

        <section class="page settings-page" data-page="settings" hidden>
          <header class="page-heading settings-heading">
            <div>
              <h1>设置</h1>
              <p>管理分配策略、外部服务、组织成员与个人账号</p>
            </div>
          </header>
          <div class="settings-layout">
            <nav class="settings-nav" aria-label="设置导航">
              <button type="button" data-settings-target="assignment"><span aria-hidden="true">⌁</span><span><strong>分配规则</strong><small>人员与职责</small></span></button>
              <button type="button" data-settings-target="config"><span aria-hidden="true">⇄</span><span><strong>对接配置</strong><small>数据源与执行</small></span></button>
              <button type="button" data-settings-target="members"><span aria-hidden="true">♙</span><span><strong>组织成员</strong><small>角色与权限</small></span></button>
              <button type="button" data-settings-target="account"><span aria-hidden="true">○</span><span><strong>我的账号</strong><small>登录与安全</small></span></button>
            </nav>
            <div class="settings-content">
        <section class="settings-panel" data-settings-panel="members" hidden>
          <div id="reactMembersPanel"></div>
        </section>
        <section class="settings-panel" data-settings-panel="account" hidden>
          <div id="reactAccountPanel"></div>
        </section>

        <section class="settings-panel" data-settings-panel="config" hidden>
          <div id="reactConfigPanel"></div>
        </section>

        <section class="settings-panel" data-settings-panel="assignment" hidden>
          <div id="reactAssignmentPanel"></div>
        </section>
            </div>
          </div>
        </section>

        <section class="page" data-page="workbench"><div id="reactWorkbenchPage"></div></section>

      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/__WEB_ENTRY__" type="module"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
