name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/gausons/auto-workflow

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      verified_image: ${{ steps.publish_image.outputs.image }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_PASSWORD: workflow-test-postgres
          POSTGRES_DB: workflow_test
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d workflow_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_PGHOST: 127.0.0.1
      TEST_PGPORT: '5432'
      TEST_PGUSER: postgres
      TEST_PGPASSWORD: workflow-test-postgres
      TEST_PGDATABASE: workflow_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Validate deployment scripts
        run: |
          for script in scripts/deploy/*.sh; do bash -n "$script"; done
          shellcheck scripts/deploy/*.sh
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build and verify Docker image
        run: |
          docker build --build-arg REVISION="$GITHUB_SHA" -t "auto-workflow:$GITHUB_SHA" .
          trap 'docker logs workflow-smoke; docker rm -f workflow-smoke' EXIT
          docker run -d --name workflow-smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --network host \
            --env DATABASE_DRIVER=postgres --env PGHOST=127.0.0.1 --env PGPORT=5432 \
            --env PGUSER=postgres --env PGPASSWORD=workflow-test-postgres --env PGDATABASE=workflow_test \
            --mount type=volume,dst=/var/lib/auto-workflow \
            --mount type=volume,dst=/app/.workflow-data "auto-workflow:$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            if docker exec workflow-smoke node scripts/deploy/container-health.mjs; then break; fi
            sleep 2
          done
          docker exec workflow-smoke node scripts/deploy/container-health.mjs
          docker restart workflow-smoke
          sleep 3
          docker exec workflow-smoke node scripts/deploy/container-health.mjs
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified commit image
        id: publish_image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tagged="$REGISTRY_IMAGE:$GITHUB_SHA"
          docker tag "auto-workflow:$GITHUB_SHA" "$tagged"
          docker push "$tagged"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tagged")
          [[ "$image" == "$REGISTRY_IMAGE@sha256:"* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Export verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "auto-workflow:$GITHUB_SHA" | gzip > release.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://autoworkflow.top
    permissions:
      contents: read
      packages: write
    steps:
      - name: Only deploy the current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded revision.'
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: steps.revision.outputs.current == 'true'
        with:
          name: release-${{ github.sha }}
      - name: Upload and activate release
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < release.tar.gz
      - name: Verify public HTTPS
        if: steps.revision.outputs.current == 'true'
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://autoworkflow.top/devices > /dev/null
      - name: Log in to GHCR for promotion
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx for promotion
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Promote deployed image to latest
        if: steps.revision.outputs.current == 'true'
        env:
          VERIFIED_IMAGE: ${{ needs.checks.outputs.verified_image }}
        run: |
          [[ "$VERIFIED_IMAGE" == "$REGISTRY_IMAGE@sha256:"* ]]
          docker buildx imagetools create --tag "$REGISTRY_IMAGE:latest" "$VERIFIED_IMAGE"
