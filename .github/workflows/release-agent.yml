name: Release Agent

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本升级：patch 修复 / minor 新功能 / major 不兼容变更'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: agent-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'Gausons/auto-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # Required only in this isolated job to push the version commit and tag.
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Commit version and create release tag atomically
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_BASE: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: bash scripts/npm/prepare-release.sh
      - name: Start verified publication on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run ci-cd.yml --ref "$RELEASE_TAG"
          echo "### 已启动连接器发布：$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '版本提交和标签已保存；npm 是否发布成功请查看后续 CI / CD，而不是仅看本任务状态。' >> "$GITHUB_STEP_SUMMARY"
          echo "[查看 CI / CD](https://github.com/$GITHUB_REPOSITORY/actions/workflows/ci-cd.yml)" >> "$GITHUB_STEP_SUMMARY"
